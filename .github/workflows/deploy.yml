name: Deploy Frontend

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Package dist
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tar -czf "dist-${TAG}.tar.gz" -C dist .

      - name: Upload tarball to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist-${TAG}.tar.gz" --clobber
          else
            gh release create "$TAG" "dist-${TAG}.tar.gz" \
              --title "$TAG" --generate-notes
          fi

      - name: Trigger gitops deploy
        env:
          GITOPS_DISPATCH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          curl --fail -X POST \
            -H "Authorization: Bearer ${GITOPS_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cpflaume/copf-demo-gitops/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"service\":\"provisioncalculator-fe\",\"environment\":\"production\",\"version\":\"${TAG}\"}}"
